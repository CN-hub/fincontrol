<script type="text/babel">
const { useState, useEffect, useRef } = React;

const VERSAO = '2.2.0';
const SISTEMA_NOME = 'FinControl';
const LS_KEYS = {
    users: 'fincontrol_users',
    installments: 'fincontrol_installments',
    backups: 'fincontrol_backups',
    totalBackups: 'fincontrol_total_backups',
    session: 'fincontrol_session',
    lastAutoBackup: 'fincontrol_last_auto_backup',
    theme: 'fincontrol_theme',
    backupPrefix: 'fincontrol_backup_',
    totalBackupPrefix: 'fincontrol_total_backup_'
};

async function hashPassword(password) {
    const data = new TextEncoder().encode(password + 'fincontrol_salt_v2');
    const buf = await crypto.subtle.digest('SHA-256', data);
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

function downloadFile(content, filename, mime = 'application/json') {
    const blob = new Blob([content], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(url);
}

// ============================================================
// BANCO DE DADOS LOCAL
// ============================================================
const DB = {
    get(key, fallback = []) {
        try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
        catch { return fallback; }
    },
    set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); return true; } catch { return false; } },
    remove(key) { localStorage.removeItem(key); },

    // USUÁRIOS
    getUsers() { return this.get(LS_KEYS.users, []); },
    setUsers(u) { return this.set(LS_KEYS.users, u); },
    findUser(username) { return this.getUsers().find(u => u.username.toLowerCase() === username.toLowerCase()); },
    findUserById(id) { return this.getUsers().find(u => u.id === id); },
    async createUser({ username, password, nome, email, role = 'user' }) {
        const users = this.getUsers();
        if (users.find(u => u.username.toLowerCase() === username.toLowerCase())) return { error: 'Usuário já cadastrado.' };
        const hash = await hashPassword(password);
        users.push({
            id: Date.now(), username, password: hash, nome_completo: nome, email,
            role, blocked: false, created_at: new Date().toISOString()
        });
        this.setUsers(users);
        return { success: true };
    },
    blockUser(id) {
        const users = this.getUsers();
        const u = users.find(x => x.id === id);
        if (!u) return { error: 'Usuário não encontrado.' };
        if (u.username.toLowerCase() === 'dev') return { error: 'O Dev não pode ser bloqueado.' };
        u.blocked = true;
        this.setUsers(users);
        return { success: true };
    },
    unblockUser(id) {
        const users = this.getUsers();
        const u = users.find(x => x.id === id);
        if (!u) return { error: 'Usuário não encontrado.' };
        u.blocked = false;
        this.setUsers(users);
        return { success: true };
    },
    deleteUser(id) {
        const users = this.getUsers();
        const u = users.find(x => x.id === id);
        if (!u) return { error: 'Usuário não encontrado.' };
        if (u.username.toLowerCase() === 'dev') return { error: 'O Dev não pode ser excluído.' };
        // Remove dados do usuário
        const inst = this.get(LS_KEYS.installments, []).filter(i => i.user_id !== id);
        this.set(LS_KEYS.installments, inst);
        this.setUsers(users.filter(x => x.id !== id));
        return { success: true };
    },

    // PARCELAS (com isolamento por usuário)
    getAllInstallments() { return this.get(LS_KEYS.installments, []); },
    getInstallments(userId = null, isAdmin = false) {
        const all = this.getAllInstallments();
        if (isAdmin) return all;
        return all.filter(i => i.user_id === userId);
    },
    setInstallments(list) { return this.set(LS_KEYS.installments, list); },
    addInstallment({ descricao, numParcelas, valorTotal }, userId) {
        const list = this.getAllInstallments();
        const np = parseInt(numParcelas);
        const vt = parseFloat(valorTotal);
        if (np <= 0 || vt <= 0) return { error: 'Valores inválidos.' };
        const prox = new Date();
        prox.setMonth(prox.getMonth() + 1);
        list.unshift({
            id: Date.now(), descricao, valor_total: vt, num_parcelas: np, parcelas_pagas: 0,
            valor_parcela: vt / np, proximo_vencimento: prox.toISOString().split('T')[0],
            status: 'Ativo', user_id: userId, created_at: new Date().toISOString()
        });
        this.setInstallments(list);
        return { success: true };
    },
    baixaParcela(id, userId, isAdmin) {
        const list = this.getAllInstallments();
        const idx = list.findIndex(i => i.id === id);
        if (idx === -1) return { error: 'Item não encontrado.' };
        if (!isAdmin && list[idx].user_id !== userId) return { error: 'Sem permissão.' };
        const item = list[idx];
        const novasPagas = item.parcelas_pagas + 1;
        const concluido = novasPagas >= item.num_parcelas;
        item.parcelas_pagas = novasPagas;
        item.status = concluido ? 'Concluído' : 'Ativo';
        if (concluido) item.proximo_vencimento = null;
        else {
            const d = new Date(item.proximo_vencimento);
            d.setMonth(d.getMonth() + 1);
            item.proximo_vencimento = d.toISOString().split('T')[0];
        }
        list[idx] = item;
        this.setInstallments(list);
        return { success: true };
    },
    updateInstallment(id, updates, userId, isAdmin) {
        const list = this.getAllInstallments();
        const idx = list.findIndex(i => i.id === id);
        if (idx === -1) return { error: 'Item não encontrado.' };
        if (!isAdmin && list[idx].user_id !== userId) return { error: 'Sem permissão.' };
        const item = list[idx];
        const novosDados = {
            ...item,
            descricao: updates.descricao ?? item.descricao,
            valor_total: parseFloat(updates.valorTotal ?? item.valor_total),
            num_parcelas: parseInt(updates.numParcelas ?? item.num_parcelas),
            proximo_vencimento: updates.proximoVencimento ?? item.proximo_vencimento,
            parcelas_pagas: parseInt(updates.parcelasPagas ?? item.parcelas_pagas)
        };
        novosDados.valor_parcela = novosDados.valor_total / novosDados.num_parcelas;
        if (novosDados.parcelas_pagas >= novosDados.num_parcelas) {
            novosDados.status = 'Concluído';
            novosDados.proximo_vencimento = null;
        } else {
            novosDados.status = 'Ativo';
        }
        list[idx] = novosDados;
        this.setInstallments(list);
        return { success: true };
    },
    deleteInstallment(id, userId, isAdmin) {
        const list = this.getAllInstallments();
        const item = list.find(i => i.id === id);
        if (!item) return { error: 'Item não encontrado.' };
        if (!isAdmin && item.user_id !== userId) return { error: 'Sem permissão.' };
        this.setInstallments(list.filter(i => i.id !== id));
        return { success: true };
    },

    // BACKUPS PESSOAIS
    getBackups() { return this.get(LS_KEYS.backups, []); },
    setBackups(b) { return this.set(LS_KEYS.backups, b); },
    createBackup(tipo = 'Manual', userId, isAdmin = false) {
        const isAuto = tipo === 'Automático';
        const dados = {
            contas_parceladas: isAdmin ? this.getAllInstallments() : this.getAllInstallments().filter(i => i.user_id === userId),
            _meta: { gerado_em: new Date().toISOString(), versao: VERSAO, sistema: SISTEMA_NOME, tipo, user_id: userId }
        };
        if (isAdmin) dados.usuarios = this.getUsers();
        const nome = `backup_${new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')}_${tipo.toLowerCase()}.json`;
        const conteudo = JSON.stringify(dados, null, 2);
        const id = Date.now();
        localStorage.setItem(LS_KEYS.backupPrefix + id, conteudo);
        const lista = this.getBackups();
        lista.unshift({
            id, nome_arquivo: nome, tamanho: (conteudo.length / 1024).toFixed(2) + ' KB',
            tipo, user_id: userId, created_at: new Date().toISOString()
        });
        const autoList = lista.filter(b => b.tipo === 'Automático' && b.user_id === userId);
        if (autoList.length > 10) {
            const remover = autoList.slice(10);
            remover.forEach(b => localStorage.removeItem(LS_KEYS.backupPrefix + b.id));
            this.setBackups(lista.filter(b => !remover.includes(b)));
        } else this.setBackups(lista);
        return { success: true, nome, tamanho: (conteudo.length / 1024).toFixed(2) + ' KB', id };
    },
    deleteBackup(id) {
        localStorage.removeItem(LS_KEYS.backupPrefix + id);
        this.setBackups(this.getBackups().filter(b => b.id !== id));
        return { success: true };
    },
    getBackupContent(id) { return localStorage.getItem(LS_KEYS.backupPrefix + id); },

    // BACKUPS TOTAIS (Sistema) - apenas admin
    getTotalBackups() { return this.get(LS_KEYS.totalBackups, []); },
    setTotalBackups(b) { return this.set(LS_KEYS.totalBackups, b); },
    createTotalBackup() {
        const dados = {
            usuarios: this.getUsers(),
            contas_parceladas: this.getAllInstallments(),
            backups_meta: this.getBackups(),
            _meta: { gerado_em: new Date().toISOString(), versao: VERSAO, sistema: SISTEMA_NOME, tipo: 'Backup Total' }
        };
        const nome = `backup_total_${new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')}.json`;
        const conteudo = JSON.stringify(dados, null, 2);
        const id = Date.now();
        localStorage.setItem(LS_KEYS.totalBackupPrefix + id, conteudo);
        const lista = this.getTotalBackups();
        lista.unshift({
            id, nome_arquivo: nome, tamanho: (conteudo.length / 1024).toFixed(2) + ' KB',
            created_at: new Date().toISOString()
        });
        if (lista.length > 20) {
            const remover = lista.slice(20);
            remover.forEach(b => localStorage.removeItem(LS_KEYS.totalBackupPrefix + b.id));
            this.setTotalBackups(lista.filter(b => !remover.includes(b)));
        } else this.setTotalBackups(lista);
        return { success: true, nome, tamanho: (conteudo.length / 1024).toFixed(2) + ' KB', id };
    },
    deleteTotalBackup(id) {
        localStorage.removeItem(LS_KEYS.totalBackupPrefix + id);
        this.setTotalBackups(this.getTotalBackups().filter(b => b.id !== id));
        return { success: true };
    },
    getTotalBackupContent(id) { return localStorage.getItem(LS_KEYS.totalBackupPrefix + id); },
    restoreTotalBackup(dados) {
        if (!dados || typeof dados !== 'object') return { error: 'Arquivo inválido.' };
        if (Array.isArray(dados.usuarios)) this.setUsers(dados.usuarios);
        if (Array.isArray(dados.contas_parceladas)) this.setInstallments(dados.contas_parceladas);
        return { success: true };
    },

    importPersonal(dados, modo = 'merge', userId) {
        if (!dados || typeof dados !== 'object') return { error: 'Arquivo inválido.' };
        if (!dados.contas_parceladas) return { error: 'Arquivo não contém contas.' };
        let importados = 0;
        let atual = modo === 'replace'
            ? this.getAllInstallments().filter(i => i.user_id !== userId)
            : this.getAllInstallments();
        dados.contas_parceladas.forEach(item => {
            const novos = { ...item, id: item.id || Date.now() + Math.random(), user_id: userId };
            if (atual.find(a => a.descricao === novos.descricao && a.valor_total === novos.valor_total && a.user_id === userId)) return;
            atual.push(novos);
            importados++;
        });
        this.setInstallments(atual);
        return { success: true, importados, modo };
    }
};

// ============================================================
// FERIADOS
// ============================================================
function calcularPascoa(ano) {
    const a = ano % 19, b = Math.floor(ano / 100), c = ano % 100;
    const d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25);
    const g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30;
    const i = Math.floor(c / 4), k = c % 4;
    const l = (32 + 2 * e + 2 * i - h - k) % 7;
    const m = Math.floor((a + 11 * h + 22 * l) / 451);
    const mes = Math.floor((h + l - 7 * m + 114) / 31);
    const dia = ((h + l - 7 * m + 114) % 31) + 1;
    return `${ano}-${String(mes).padStart(2,'0')}-${String(dia).padStart(2,'0')}`;
}
function getFeriados(ano) {
    const tsP = new Date(calcularPascoa(ano) + 'T00:00:00').getTime();
    const dOff = (d) => new Date(tsP + d * 86400000).toISOString().split('T')[0];
    return {
        [`${ano}-01-01`]: 'Confraternização Universal', [`${ano}-04-21`]: 'Tiradentes',
        [`${ano}-05-01`]: 'Dia do Trabalho', [`${ano}-09-07`]: 'Independência do Brasil',
        [`${ano}-10-12`]: 'Nossa Senhora Aparecida', [`${ano}-11-02`]: 'Finados',
        [`${ano}-11-15`]: 'Proclamação da República', [`${ano}-11-20`]: 'Consciência Negra',
        [`${ano}-12-25`]: 'Natal',
        [dOff(-48)]: 'Carnaval (Segunda)', [dOff(-47)]: 'Carnaval (Terça)',
        [dOff(-46)]: 'Quarta-feira de Cinzas', [dOff(-2)]: 'Sexta-feira Santa', [dOff(60)]: 'Corpus Christi'
    };
}
function getComemorativas(ano) {
    return {
        [`${ano}-03-08`]: 'Dia Internacional da Mulher', [`${ano}-03-15`]: 'Dia do Consumidor',
        [`${ano}-04-01`]: 'Dia da Mentira', [`${ano}-04-22`]: 'Descobrimento do Brasil',
        [`${ano}-05-11`]: 'Dia das Mães', [`${ano}-06-12`]: 'Dia dos Namorados',
        [`${ano}-07-20`]: 'Dia do Amigo', [`${ano}-08-11`]: 'Dia do Estudante',
        [`${ano}-08-22`]: 'Dia do Folclore', [`${ano}-09-21`]: 'Dia da Árvore',
        [`${ano}-10-15`]: 'Dia do Professor', [`${ano}-10-31`]: 'Halloween',
        [`${ano}-11-19`]: 'Dia da Bandeira', [`${ano}-12-24`]: 'Véspera de Natal', [`${ano}-12-31`]: 'Véspera de Ano Novo'
    };
}

        eye: <><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></>,
        printer: <><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect width="12" height="8" x="6" y="14"/></>,
        shield: <><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></>,
        ban: <><circle cx="12" cy="12" r="10"/><path d="m4.9 4.9 14.2 14.2"/></>,
        check: <polyline points="20 6 9 17 4 12"/>,
        crown: <><path d="m2 4 3 12h14l3-12-6 7-4-7-4 7-6-7z"/><path d="M5 20h14"/></>
    };
    return <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{I[name]}</svg>;
};

function LoginScreen({ onLogin, isDark, toggleTheme }) {
    const [modo, setModo] = useState('login');
    const [f, setF] = useState({ username:'', password:'', confirmPassword:'', nome:'', email:'' });
    const [error, setError] = useState('');
    const [success, setSuccess] = useState('');
    const [loading, setLoading] = useState(false);
    const reset = () => { setF({ username:'', password:'', confirmPassword:'', nome:'', email:'' }); setError(''); setSuccess(''); };
    const upd = (k) => (e) => setF({ ...f, [k]: e.target.value });

    const handleLogin = async (e) => {
        e.preventDefault(); setLoading(true); setError(''); setSuccess('');
        try {
            const user = DB.findUser(f.username);
            if (!user) { setError('Usuário ou senha incorretos.'); setLoading(false); return; }
            if (user.blocked) { setError('Conta bloqueada. Contate o administrador.'); setLoading(false); return; }
            const hash = await hashPassword(f.password);
            if (hash !== user.password) { setError('Usuário ou senha incorretos.'); setLoading(false); return; }
            DB.set(LS_KEYS.session, { username: user.username, id: user.id, role: user.role || 'user', at: Date.now() });
            onLogin(user);
        } catch { setError('Erro ao processar login.'); }
        setLoading(false);
    };

    const handleRegister = async (e) => {
        e.preventDefault(); setError(''); setSuccess('');
        if (f.password !== f.confirmPassword) { setError('As senhas não coincidem.'); return; }
        if (f.password.length < 6) { setError('Senha deve ter 6+ caracteres.'); return; }
        if (f.username.length < 3) { setError('Usuário deve ter 3+ caracteres.'); return; }
        if (f.username.toLowerCase() === 'dev') { setError('Este nome é reservado.'); return; }
        setLoading(true);
        const res = await DB.createUser({ username: f.username, password: f.password, nome: f.nome, email: f.email, role: 'user' });
        if (res.success) { setSuccess('Conta criada! Faça login.'); setTimeout(() => { setModo('login'); reset(); }, 2000); }
        else setError(res.error);
        setLoading(false);
    };

    const bgClass = isDark ? 'bg-gradient-to-br from-palette-black via-palette-navy3 to-palette-navy1' : 'bg-gradient-to-br from-palette-bgMain via-palette-bgAlt to-palette-bgMain';
    const cardBg = isDark ? 'bg-palette-navy1/90 border-palette-borderDark' : 'bg-palette-surface/95 border-palette-border';
    const inputBg = isDark ? 'bg-palette-navy3 border-palette-borderDark text-palette-bgMain' : 'bg-palette-bgMain border-palette-border text-palette-navy3';
    const txtMut = isDark ? 'text-palette-gold' : 'text-palette-grayText';
    const tabBg = isDark ? 'bg-palette-navy3/60' : 'bg-palette-bgAlt';

    return (
        <div className={`min-h-screen flex items-center justify-center p-4 ${bgClass} transition-colors duration-300`}>
            <div className="fixed top-4 right-4 z-10"><Theme3D isDark={isDark} toggle={toggleTheme}/></div>
            <div className={`w-full max-w-md p-8 rounded-3xl backdrop-blur-xl border shadow-2xl animate-in ${cardBg}`}>
                <div className="flex justify-center mb-6">
                    <div className="p-4 bg-gradient-to-br from-palette-gold to-palette-goldDark rounded-2xl shadow-lg shadow-palette-gold/30">
                        <Icon name="wallet" className="w-10 h-10 text-palette-navy3"/>
                    </div>
                </div>
                <h1 className={`text-2xl font-bold text-center mb-1 ${isDark ? 'text-palette-bgMain' : 'text-palette-navy3'}`}>FinControl</h1>
                <div className="flex items-center justify-center gap-2 mb-6">
                    <span className={`text-xs px-2 py-0.5 rounded-full border ${isDark ? 'border-palette-borderDark text-palette-gold bg-palette-navy3/60' : 'border-palette-border text-palette-grayText bg-palette-bgAlt'}`}>
                        <Icon name="tag" className="w-3 h-3 inline mr-1"/>v{VERSAO}
                    </span>
                </div>
                <p className={`text-center text-sm mb-6 ${txtMut}`}>{modo === 'login' ? 'Acesse sua conta' : 'Crie sua conta'}</p>
                <div className={`flex rounded-xl p-1 mb-6 ${tabBg}`}>
                    <button type="button" onClick={() => { setModo('login'); reset(); }}
                        className={`flex-1 py-2 rounded-lg text-sm font-bold transition-all ${modo === 'login' ? 'bg-gradient-to-r from-palette-gold to-palette-goldDark text-palette-navy3 shadow-md' : txtMut}`}>Entrar</button>
                    <button type="button" onClick={() => { setModo('register'); reset(); }}
                        className={`flex-1 py-2 rounded-lg text-sm font-bold transition-all ${modo === 'register' ? 'bg-gradient-to-r from-palette-gold to-palette-goldDark text-palette-navy3 shadow-md' : txtMut}`}>Cadastrar</button>
                </div>
                {error && <div className="mb-4 p-3 bg-red-100 dark:bg-red-900/30 border border-red-300 dark:border-red-800 rounded-lg text-red-700 dark:text-red-300 text-sm text-center">{error}</div>}
                {success && <div className="mb-4 p-3 bg-green-100 dark:bg-green-900/30 border border-green-300 dark:border-green-800 rounded-lg text-green-700 dark:text-green-300 text-sm text-center">{success}</div>}
                <form onSubmit={modo === 'login' ? handleLogin : handleRegister} className="space-y-4">
                    {modo === 'register' && (
                        <div>
                            <label className={`block text-sm font-medium mb-2 ${isDark ? 'text-palette-bgMain' : 'text-palette-navy3'}`}>Nome Completo</label>
                            <div className="relative">
                                <Icon name="user" className={`w-5 h-5 absolute left-3 top-1/2 -translate-y-1/2 ${txtMut}`}/>
                                <input type="text" value={f.nome} onChange={upd('nome')} placeholder="Seu nome" required
                                    className={`w-full pl-11 pr-4 py-3 border rounded-xl outline-none focus:border-palette-gold ${inputBg}`}/>
                            </div>
                        </div>
                    )}
                    <div>
                        <label className={`block text-sm font-medium mb-2 ${isDark ? 'text-palette-bgMain' : 'text-palette-navy3'}`}>Usuário</label>
                        <div className="relative">
                            <Icon name="user" className={`w-5 h-5 absolute left-3 top-1/2 -translate-y-1/2 ${txtMut}`}/>
                            <input type="text" value={f.username} onChange={upd('username')} placeholder="Escolha um usuário" required
                                className={`w-full pl-11 pr-4 py-3 border rounded-xl outline-none focus:border-palette-gold ${inputBg}`}/>
                        </div>
                    </div>
                    {modo === 'register' && (
                        <div>
                            <label className={`block text-sm font-medium mb-2 ${isDark ? 'text-palette-bgMain' : 'text-palette-navy3'}`}>E-mail</label>
                            <div className="relative">
                                <Icon name="mail" className={`w-5 h-5 absolute left-3 top-1/2 -translate-y-1/2 ${txtMut}`}/>
                                <input type="email" value={f.email} onChange={upd('email')} placeholder="seu@email.com"
                                    className={`w-full pl-11 pr-4 py-3 border rounded-xl outline-none focus:border-palette-gold ${inputBg}`}/>
                            </div>
                        </div>
                    )}
                    <div>
                        <label className={`block text-sm font-medium mb-2 ${isDark ? 'text-palette-bgMain' : 'text-palette-navy3'}`}>Senha</label>
                        <div className="relative">
                            <Icon name="lock" className={`w-5 h-5 absolute left-3 top-1/2 -translate-y-1/2 ${txtMut}`}/>
                            <input type="password" value={f.password} onChange={upd('password')} placeholder="Mínimo 6 caracteres" required
                                className={`w-full pl-11 pr-4 py-3 border rounded-xl outline-none focus:border-palette-gold ${inputBg}`}/>
                        </div>
                    </div>
                    {modo === 'register' && (
                        <div>
                            <label className={`block text-sm font-medium mb-2 ${isDark ? 'text-palette-bgMain' : 'text-palette-navy3'}`}>Confirmar Senha</label>
                            <div className="relative">
                                <Icon name="lock" className={`w-5 h-5 absolute left-3 top-1/2 -translate-y-1/2 ${txtMut}`}/>
                                <input type="password" value={f.confirmPassword} onChange={upd('confirmPassword')} placeholder="Repita a senha" required

                    <button type="submit" disabled={loading}

function CalendarView({ isDark, userId, isAdmin }) {
    const [dt, setDt] = useState(new Date());
    const [sel, setSel] = useState(null);
    const [installments, setInstallments] = useState(DB.getInstallments(userId, isAdmin));
    const ano = dt.getFullYear(); const mes = dt.getMonth() + 1;
    const meses = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
    const sem = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
    const feriados = getFeriados(ano);
    const comemorativas = getComemorativas(ano);

    useEffect(() => { setInstallments(DB.getInstallments(userId, isAdmin)); }, [userId, isAdmin]);

    const mudar = (d) => setDt(new Date(ano, mes - 1 + d, 1));
    const primeiro = new Date(ano, mes - 1, 1).getDay();
    const total = new Date(ano, mes, 0).getDate();
    const dias = [];
    for (let i = 0; i < primeiro; i++) dias.push(null);
    for (let i = 1; i <= total; i++) dias.push(i);
    const hj = new Date();
    const isHoje = (d) => d === hj.getDate() && mes === (hj.getMonth() + 1) && ano === hj.getFullYear();
    const getEv = (dia) => {
        if (!dia) return { feriado:null, comemorativa:null, parcelas:[] };
        const k = `${ano}-${String(mes).padStart(2,'0')}-${String(dia).padStart(2,'0')}`;
        return { feriado: feriados[k] || null, comemorativa: comemorativas[k] || null, parcelas: installments.filter(p => p.proximo_vencimento === k && p.status !== 'Concluído') };
    };
    const evSel = sel ? getEv(sel) : null;

    const cardBg = isDark ? 'bg-palette-navy1 border-palette-borderDark' : 'bg-palette-surface border-palette-border shadow-sm';
    const txtMut = isDark ? 'text-palette-gold' : 'text-palette-grayText';
    const btnBg = isDark ? 'bg-palette-navy3 text-palette-gold' : 'bg-palette-bgAlt text-palette-navy3';

    return (
        <div className="space-y-6 animate-in">
            <div className={`p-6 rounded-2xl border ${cardBg}`}>
                <div className="flex flex-col md:flex-row md:justify-between md:items-center gap-4 mb-6">
                    <div className="flex items-center gap-3">
                        <button onClick={() => mudar(-1)} className={`p-2 rounded-lg ${btnBg}`}><Icon name="chevronLeft" className="w-5 h-5"/></button>
                        <h2 className="text-lg md:text-xl font-bold min-w-[180px] text-center">{meses[mes - 1]} {ano}</h2>
                        <button onClick={() => mudar(1)} className={`p-2 rounded-lg ${btnBg}`}><Icon name="chevronRight" className="w-5 h-5"/></button>
                        <button onClick={() => setDt(new Date())} className="px-3 py-2 text-sm bg-palette-gold/25 text-palette-goldDark dark:text-palette-gold rounded-lg hover:bg-palette-gold/40">Hoje</button>
                    </div>
                    <div className="flex flex-wrap gap-3 text-xs">
                        <span className="flex items-center gap-1"><div className="w-3 h-3 rounded-full bg-red-400"></div> Feriado</span>
                        <span className="flex items-center gap-1"><div className="w-3 h-3 rounded-full bg-purple-400"></div> Comemorativa</span>
                        <span className="flex items-center gap-1"><div className="w-3 h-3 rounded-full bg-palette-gold"></div> Vencimento</span>
                    </div>
                </div>
                <div className="grid grid-cols-7 gap-1 md:gap-2 mb-2">
                    {sem.map(d => <div key={d} className={`text-center text-xs font-bold py-2 ${txtMut}`}>{d}</div>)}
                </div>
                <div className="grid grid-cols-7 gap-1 md:gap-2">
                    {dias.map((dia, i) => {
                        const e = dia ? getEv(dia) : { feriado:null, comemorativa:null, parcelas:[] };
                        const tem = e.feriado || e.comemorativa || e.parcelas.length > 0;
                        const fim = [0, 6].includes(i % 7);
                        return (
                            <button key={i} onClick={() => dia && setSel(dia)} disabled={!dia}
                                className={`min-h-[70px] md:min-h-[90px] p-1 md:p-2 rounded-xl border text-left transition-all hover:scale-[1.02] ${
                                    !dia ? 'opacity-0 cursor-default' :
                                    isHoje(dia) ? 'border-palette-gold bg-palette-gold/20 ring-2 ring-palette-gold' :
                                    e.feriado ? 'border-red-300 bg-red-50 dark:bg-red-900/20 dark:border-red-800' :
                                    tem ? isDark ? 'border-palette-borderDark bg-palette-navy3/50' : 'border-palette-border bg-palette-bgAlt' :
                                    isDark ? `border-palette-borderDark ${fim ? 'bg-palette-navy3/30' : 'bg-palette-navy3/10'}` : `border-palette-border ${fim ? 'bg-palette-bgAlt' : 'bg-palette-bgMain'}`
                                }`}>
                                <div className={`text-xs md:text-sm font-bold mb-1 ${e.feriado ? 'text-red-600 dark:text-red-400' : isHoje(dia) ? 'text-palette-goldDark dark:text-palette-gold' : ''}`}>{dia}</div>
                                <div className="space-y-0.5 hidden md:block">
                                    {e.feriado && <div className="text-[9px] bg-red-100 dark:bg-red-900/30 text-red-700 dark:text-red-300 px-1 rounded truncate">🔴 {e.feriado.substring(0,14)}</div>}
                                    {e.comemorativa && <div className="text-[9px] bg-purple-100 dark:bg-purple-900/30 text-purple-700 dark:text-purple-300 px-1 rounded truncate">💜 {e.comemorativa.substring(0,14)}</div>}
                                    {e.parcelas.map((p, idx) => (
                                        <div key={idx} className="text-[9px] bg-palette-gold/25 text-palette-goldDark dark:text-palette-gold px-1 rounded truncate">💰 {p.descricao.substring(0,12)}</div>
                                    ))}
                                </div>
                                {tem && <div className="md:hidden flex gap-0.5 mt-1">
                                    {e.feriado && <div className="w-1.5 h-1.5 rounded-full bg-red-400"/>}
                                    {e.comemorativa && <div className="w-1.5 h-1.5 rounded-full bg-purple-400"/>}
                                    {e.parcelas.length > 0 && <div className="w-1.5 h-1.5 rounded-full bg-palette-gold"/>}
                                </div>}
                            </button>
                        );
                    })}
                </div>
            </div>
            {sel && evSel && (
                <div className={`p-6 rounded-2xl border ${cardBg} animate-in`}>
                    <div className="flex justify-between items-center mb-4">
                        <h3 className="text-lg font-bold">Eventos de {String(sel).padStart(2,'0')}/{String(mes).padStart(2,'0')}/{ano}</h3>
                        <button onClick={() => setSel(null)} className={txtMut}><Icon name="x" className="w-5 h-5"/></button>
                    </div>
                    <div className="space-y-3">
                        {evSel.feriado && (
                            <div className="flex items-center gap-3 p-3 bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 rounded-xl">
                                <div className="p-2 bg-red-100 dark:bg-red-900/40 text-red-600 dark:text-red-400 rounded-lg"><Icon name="info" className="w-5 h-5"/></div>
                                <div><p className="font-bold text-red-700 dark:text-red-400">Feriado Nacional</p><p className="text-sm">{evSel.feriado}</p></div>
                            </div>
                        )}
                        {evSel.comemorativa && (
                            <div className="flex items-center gap-3 p-3 bg-purple-50 dark:bg-purple-900/20 border border-purple-200 dark:border-purple-800 rounded-xl">
                                <div className="p-2 bg-purple-100 dark:bg-purple-900/40 text-purple-600 dark:text-purple-400 rounded-lg"><Icon name="gift" className="w-5 h-5"/></div>
                                <div><p className="font-bold text-purple-700 dark:text-purple-400">Data Comemorativa</p><p className="text-sm">{evSel.comemorativa}</p></div>
                            </div>
                        )}
                        {evSel.parcelas.map((p, i) => (
                            <div key={i} className="flex items-center gap-3 p-3 bg-palette-gold/10 border border-palette-gold/40 rounded-xl">
                                <div className="p-2 bg-palette-gold/30 text-palette-goldDark rounded-lg"><Icon name="dollar" className="w-5 h-5"/></div>
                                <div><p className="font-bold text-palette-goldDark dark:text-palette-gold">Vencimento</p><p className="text-sm">{p.descricao} - R$ {parseFloat(p.valor_parcela).toFixed(2)}</p></div>
                            </div>
                        ))}
                        {!evSel.feriado && !evSel.comemorativa && evSel.parcelas.length === 0 && (
                            <p className={`${txtMut} text-sm text-center py-4`}>Nenhum evento neste dia.</p>
                        )}
                    </div>
                </div>
            )}
        </div>
    );
}

function App() {
    const [user, setUser] = useState(null);

    const [isDark, setIsDark] = useState(false);
    const [tab, setTab] = useState('dashboard');
    const [sideOpen, setSideOpen] = useState(false);
    const [inst, setInst] = useState([]);
    const [bkp, setBkp] = useState([]);
    const [totalBkp, setTotalBkp] = useState([]);
    const [allUsers, setAllUsers] = useState([]);
    const [modal, setModal] = useState(false);
    const [form, setForm] = useState({ descricao:'', total:'', valorTotal:'' });
    const [lastAuto, setLastAuto] = useState(null);

    // Modais
    const [importModal, setImportModal] = useState(false);
    const [importFile, setImportFile] = useState(null);
    const [importModo, setImportModo] = useState('merge');
    const [importLoading, setImportLoading] = useState(false);
    const [importMsg, setImportMsg] = useState(null);
    const [dragActive, setDragActive] = useState(false);
    const fileInputRef = useRef(null);

    // Editar
    const [editModal, setEditModal] = useState(false);
    const [editItem, setEditItem] = useState(null);

    // Ver detalhes
    const [viewModal, setViewModal] = useState(false);
    const [viewItem, setViewItem] = useState(null);

    // Logout
    const [logoutModal, setLogoutModal] = useState(false);

    const isAdmin = user && (user.role === 'admin' || user.username?.toLowerCase() === 'dev');
    const userId = user ? user.id : null;

    // Inicialização
    useEffect(() => {
        (async () => {
            const users = DB.getUsers();
            const devExists = users.find(u => u.username.toLowerCase() === 'dev');
            if (!devExists) {
                await DB.createUser({ username: 'Dev', password: '123456', nome: 'Administrador Dev', email: 'dev@fincontrol.com', role: 'admin' });
            } else if (devExists.role !== 'admin') {
                // Migração: garante que Dev seja admin
                const all = DB.getUsers();
                const idx = all.findIndex(u => u.username.toLowerCase() === 'dev');
                all[idx].role = 'admin';
                DB.setUsers(all);
            }
            const sess = DB.get(LS_KEYS.session, null);
            if (sess && sess.username) {
                const u = DB.findUser(sess.username);
                if (u && !u.blocked) setUser(u);
                else DB.remove(LS_KEYS.session);
            }
            const t = DB.get(LS_KEYS.theme, 'light');
            setIsDark(t === 'dark');
            const lastTs = DB.get(LS_KEYS.lastAutoBackup, null);
            if (lastTs) setLastAuto(new Date(lastTs).toLocaleString('pt-BR'));
            setChecking(false);
        })();
    }, []);

    const refreshData = () => {
        if (!user) return;
        setInst(DB.getInstallments(user.id, isAdmin));

                            <div className={`p-3 rounded-lg ${isDark ? 'bg-palette-navy3' : 'bg-palette-bgAlt'}`}><p className={`text-xs ${txtMut}`}>Status</p><p className="font-bold">{viewItem.status}</p></div>
                            <div className={`p-3 rounded-lg ${isDark ? 'bg-palette-navy3' : 'bg-palette-bgAlt'}`}><p className={`text-xs ${txtMut}`}>Valor Total</p><p className="font-bold">R$ {parseFloat(viewItem.valor_total).toFixed(2)}</p></div>
                            <div className={`p-3 rounded-lg ${isDark ? 'bg-palette-navy3' : 'bg-palette-bgAlt'}`}><p className={`text-xs ${txtMut}`}>Valor Parcela</p><p className="font-bold">R$ {parseFloat(viewItem.valor_parcela).toFixed(2)}</p></div>
                            <div className={`p-3 rounded-lg ${isDark ? 'bg-palette-navy3' : 'bg-palette-bgAlt'}`}><p className={`text-xs ${txtMut}`}>Progresso</p><p className="font-bold">{viewItem.parcelas_pagas} / {viewItem.num_parcelas}</p></div>
                            <div className={`p-3 rounded-lg ${isDark ? 'bg-palette-navy3' : 'bg-palette-bgAlt'}`}><p className={`text-xs ${txtMut}`}>Próx. Vencimento</p><p className="font-bold">{viewItem.proximo_vencimento || 'Concluído'}</p></div>
                        </div>
                        <div className="grid grid-cols-2 gap-3">
                            <div className="p-3 rounded-lg bg-green-100 dark:bg-green-900/30"><p className="text-xs text-green-700 dark:text-green-400">Total Pago</p><p className="font-bold text-green-700 dark:text-green-400">R$ {(viewItem.parcelas_pagas * parseFloat(viewItem.valor_parcela)).toFixed(2)}</p></div>
                            <div className="p-3 rounded-lg bg-red-100 dark:bg-red-900/30"><p className="text-xs text-red-700 dark:text-red-400">Saldo Restante</p><p className="font-bold text-red-700 dark:text-red-400">R$ {((viewItem.num_parcelas - viewItem.parcelas_pagas) * parseFloat(viewItem.valor_parcela)).toFixed(2)}</p></div>
                        </div>
                        <div className="pt-4 flex justify-end gap-3">
                            <button onClick={() => { imprimirParcela(viewItem); }} className="flex items-center gap-2 px-4 py-2 bg-purple-100 dark:bg-purple-900/30 text-purple-700 dark:text-purple-400 rounded-lg font-bold"><Icon name="printer" className="w-4 h-4"/> Imprimir</button>
                            <button onClick={() => { setEditItem(viewItem); setViewModal(false); setEditModal(true); }} className="flex items-center gap-2 px-4 py-2 bg-blue-100 dark:bg-blue-900/30 text-blue-700 dark:text-blue-400 rounded-lg font-bold"><Icon name="edit" className="w-4 h-4"/> Editar</button>
                        </div>
                    </div>
                )}
            </Modal>

            {/* Modal Editar */}
            <Modal isOpen={editModal} onClose={() => { setEditModal(false); setEditItem(null); }} title="Editar Conta" isDark={isDark}>
                {editItem && (
                    <form onSubmit={salvarEdicao} className="space-y-4">
                        <div>
                            <label className="block text-sm font-medium mb-1">Descrição</label>
                            <input type="text" required value={editItem.descricao} onChange={e => setEditItem({ ...editItem, descricao: e.target.value })}
                                className={`w-full border rounded-lg p-3 outline-none focus:border-palette-gold ${inputBg}`}/>
                        </div>
                        <div className="grid grid-cols-2 gap-4">
                            <div>
                                <label className="block text-sm font-medium mb-1">Valor Total</label>
                                <input type="number" step="0.01" required value={editItem.valor_total} onChange={e => setEditItem({ ...editItem, valor_total: e.target.value })}
                                    className={`w-full border rounded-lg p-3 outline-none focus:border-palette-gold ${inputBg}`}/>
                            </div>
                            <div>
                                <label className="block text-sm font-medium mb-1">Nº Parcelas</label>
                                <input type="number" min="1" required value={editItem.num_parcelas} onChange={e => setEditItem({ ...editItem, num_parcelas: e.target.value })}
                                    className={`w-full border rounded-lg p-3 outline-none focus:border-palette-gold ${inputBg}`}/>
                            </div>
                            <div>
                                <label className="block text-sm font-medium mb-1">Parcelas Pagas</label>
                                <input type="number" min="0" required value={editItem.parcelas_pagas} onChange={e => setEditItem({ ...editItem, parcelas_pagas: e.target.value })}
                                    className={`w-full border rounded-lg p-3 outline-none focus:border-palette-gold ${inputBg}`}/>
                            </div>
                            <div>
                                <label className="block text-sm font-medium mb-1">Próx. Vencimento</label>
                                <input type="date" value={editItem.proximo_vencimento || ''} onChange={e => setEditItem({ ...editItem, proximo_vencimento: e.target.value })}
                                    className={`w-full border rounded-lg p-3 outline-none focus:border-palette-gold ${inputBg}`}/>
                            </div>
                        </div>
                        <div className="pt-4 flex justify-end gap-3">
                            <button type="button" onClick={() => { setEditModal(false); setEditItem(null); }} className={`px-4 py-2 rounded-lg ${txtMut}`}>Cancelar</button>
                            <button type="submit" className="px-6 py-2 bg-gradient-to-r from-palette-gold to-palette-goldDark text-palette-navy3 rounded-lg font-bold">Salvar</button>
                        </div>
                    </form>
                )}
            </Modal>

            {/* Modal Importar */}
            <Modal isOpen={importModal} onClose={() => { setImportModal(false); setImportFile(null); setImportMsg(null); }} title="Importar Backup" isDark={isDark}>
                <div className="space-y-4">
                    <div className={`p-4 rounded-xl border border-palette-gold/40 ${isDark ? 'bg-palette-navy3/50' : 'bg-palette-bgAlt'}`}>
                        <p className="text-xs"><strong className="text-palette-goldDark dark:text-palette-gold">⚠️ Atenção:</strong> A importação afeta apenas os SEUS dados.</p>
                    </div>
                    <div>
                        <label className="block text-sm font-medium mb-2">Modo</label>
                        <div className={`flex rounded-xl p-1 ${isDark ? 'bg-palette-navy3' : 'bg-palette-bgAlt'}`}>
                            <button type="button" onClick={() => setImportModo('merge')}
                                className={`flex-1 py-2 rounded-lg text-sm font-bold transition-all ${importModo === 'merge' ? 'bg-gradient-to-r from-palette-gold to-palette-goldDark text-palette-navy3' : txtMut}`}>Mesclar</button>
                            <button type="button" onClick={() => setImportModo('replace')}
                                className={`flex-1 py-2 rounded-lg text-sm font-bold transition-all ${importModo === 'replace' ? 'bg-gradient-to-r from-red-500 to-orange-500 text-white' : txtMut}`}>Substituir</button>
                        </div>
                    </div>
                    <div onClick={() => fileInputRef.current?.click()}
                        onDragOver={(e) => { e.preventDefault(); setDragActive(true); }}
                        onDragLeave={() => setDragActive(false)}
                        onDrop={(e) => { e.preventDefault(); setDragActive(false); if (e.dataTransfer.files[0]) { setImportFile(e.dataTransfer.files[0]); setImportMsg(null); } }}
                        className={`drop-zone ${dragActive ? 'active' : ''} rounded-xl p-8 text-center cursor-pointer`}>
                        <input ref={fileInputRef} type="file" accept=".json" className="hidden"
                            onChange={(e) => { if (e.target.files[0]) { setImportFile(e.target.files[0]); setImportMsg(null); } }}/>
                        <Icon name="upload" className="w-10 h-10 mx-auto mb-3 text-palette-goldDark dark:text-palette-gold"/>
                        {importFile ? (
                            <div>
                                <p className="font-bold text-green-600 dark:text-green-400">✓ {importFile.name}</p>
                                <p className={`text-xs ${txtMut} mt-1`}>{(importFile.size / 1024).toFixed(2)} KB</p>
                            </div>
                        ) : (
                            <div>
                                <p className="font-medium">Clique ou arraste o arquivo aqui</p>
                                <p className={`text-xs ${txtMut} mt-1`}>Apenas arquivos .json</p>
                            </div>
                        )}
                    </div>
                    {importMsg && (
                        <div className={`p-3 rounded-lg text-sm border ${importMsg.tipo === 'success' ? 'bg-green-100 border-green-300 text-green-700 dark:bg-green-900/30 dark:border-green-800 dark:text-green-400' : 'bg-red-100 border-red-300 text-red-700 dark:bg-red-900/30 dark:border-red-800 dark:text-red-400'}`}>
                            {importMsg.texto}
                        </div>
                    )}
                    <div className="pt-2 flex justify-end gap-3">
                        <button type="button" onClick={() => { setImportModal(false); setImportFile(null); setImportMsg(null); }} className={`px-4 py-2 rounded-lg ${txtMut}`}>Cancelar</button>
                        <button type="button" onClick={handleImportSubmit} disabled={importLoading || !importFile}
                            className="px-6 py-2 bg-gradient-to-r from-palette-gold to-palette-goldDark text-palette-navy3 rounded-lg font-bold disabled:opacity-50 flex items-center gap-2">
                            {importLoading ? 'Importando...' : (<><Icon name="upload" className="w-4 h-4"/> Importar</>)}
                        </button>
                    </div>
                </div>
            </Modal>

            {/* Modal Logout */}
            <Modal isOpen={logoutModal} onClose={() => setLogoutModal(false)} title="Sair do Sistema" isDark={isDark}>
                <div className="space-y-4">
                    <p className="text-sm">Deseja realizar um backup antes de sair?</p>
                    <p className={`text-xs ${txtMut}`}>Recomendamos fazer um backup para não perder dados. O backup automático já é feito a cada hora, mas um backup manual garante os dados mais recentes.</p>
                    <div className="pt-4 flex flex-col sm:flex-row justify-end gap-3">
                        <button onClick={() => confirmLogout(false)} className={`px-4 py-2 rounded-lg ${txtMut} border ${isDark ? 'border-palette-borderDark' : 'border-palette-border'}`}>Sair sem Backup</button>
                        <button onClick={() => confirmLogout(true)} className="px-6 py-2 bg-gradient-to-r from-palette-gold to-palette-goldDark text-palette-navy3 rounded-lg font-bold flex items-center justify-center gap-2">
                            <Icon name="database" className="w-4 h-4"/> Backup e Sair
                        </button>
                    </div>
                </div>
            </Modal>
        </div>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
