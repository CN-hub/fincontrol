<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ============================================================
// CONFIGURAÇÕES DO SISTEMA
// ============================================================
const VERSAO = '2.1.0';
const SISTEMA_NOME = 'FinControl';
const LS_KEYS = {
    users: 'fincontrol_users',
    installments: 'fincontrol_installments',
    backups: 'fincontrol_backups',
    session: 'fincontrol_session',
    lastAutoBackup: 'fincontrol_last_auto_backup',
    theme: 'fincontrol_theme',
    backupPrefix: 'fincontrol_backup_'
};

// ============================================================
// HASH DE SENHA (SHA-256 client-side)
// ============================================================
async function hashPassword(password) {
    const encoder = new TextEncoder();
    const data = encoder.encode(password + 'fincontrol_salt_v2');
    const hashBuffer = await crypto.subtle.digest('SHA-256', data);
    return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
}

// ============================================================
// STORAGE HELPERS (localStorage como "banco de dados")
// ============================================================
const DB = {
    get(key, fallback = []) {
        try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
        catch { return fallback; }
    },
    set(key, value) {
        try { localStorage.setItem(key, JSON.stringify(value)); return true; }
        catch (e) { console.error('Erro ao salvar:', e); return false; }
    },
    remove(key) { localStorage.removeItem(key); },

    // Usuários
    getUsers() { return this.get(LS_KEYS.users, []); },
    setUsers(u) { return this.set(LS_KEYS.users, u); },
    findUser(username) {
        return this.getUsers().find(u => u.username.toLowerCase() === username.toLowerCase());
    },
    async createUser({ username, password, nome, email }) {
        const users = this.getUsers();
        if (users.find(u => u.username.toLowerCase() === username.toLowerCase())) {
            return { error: 'Usuário já cadastrado.' };
        }
        const hash = await hashPassword(password);
        users.push({ id: Date.now(), username, password: hash, nome_completo: nome, email, created_at: new Date().toISOString() });
        this.setUsers(users);
        return { success: true };
    },

    // Parcelas
    getInstallments() { return this.get(LS_KEYS.installments, []); },
    setInstallments(i) { return this.set(LS_KEYS.installments, i); },
    addInstallment({ descricao, numParcelas, valorTotal }) {
        const list = this.getInstallments();
        const np = parseInt(numParcelas);
        const vt = parseFloat(valorTotal);
        if (np <= 0 || vt <= 0) return { error: 'Valores inválidos.' };
        const proximoMes = new Date();
        proximoMes.setMonth(proximoMes.getMonth() + 1);
        const novo = {
            id: Date.now(),
            descricao,
            valor_total: vt,
            num_parcelas: np,
            parcelas_pagas: 0,
            valor_parcela: vt / np,
            proximo_vencimento: proximoMes.toISOString().split('T')[0],
            status: 'Ativo',
            created_at: new Date().toISOString()
        };
        list.unshift(novo);
        this.setInstallments(list);
        return { success: true };
    },
    baixaParcela(id) {
        const list = this.getInstallments();
        const idx = list.findIndex(i => i.id === id);
        if (idx === -1) return { error: 'Item não encontrado.' };
        const item = list[idx];
        const novasPagas = item.parcelas_pagas + 1;
        const concluido = novasPagas >= item.num_parcelas;
        item.parcelas_pagas = novasPagas;
        item.status = concluido ? 'Concluído' : 'Ativo';
        if (concluido) {
            item.proximo_vencimento = null;
        } else {
            const d = new Date(item.proximo_vencimento);
            d.setMonth(d.getMonth() + 1);
            item.proximo_vencimento = d.toISOString().split('T')[0];
        }
        list[idx] = item;
        this.setInstallments(list);
        return { success: true };
    },

    // Backups
    getBackups() { return this.get(LS_KEYS.backups, []); },
    setBackups(b) { return this.set(LS_KEYS.backups, b); },
    createBackup(tipo = 'Manual') {
        const data = {
            contas_parceladas: this.getInstallments(),
            usuarios: this.getUsers(),
            _meta: { gerado_em: new Date().toISOString(), versao: VERSAO, sistema: SISTEMA_NOME, tipo }
        };
        const nome = `backup_${new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')}_${tipo.toLowerCase()}.json`;
        const conteudo = JSON.stringify(data, null, 2);
        const id = Date.now();
        localStorage.setItem(LS_KEYS.backupPrefix + id, conteudo);
        const lista = this.getBackups();
        lista.unshift({
            id, nome_arquivo: nome, tamanho: (conteudo.length / 1024).toFixed(2) + ' KB',
            tipo, created_at: new Date().toISOString()
        });
        // Limita automáticos a 10
        const autoCount = lista.filter(b => b.tipo === 'Automático').length;
        if (autoCount > 10) {
            const autoList = lista.filter(b => b.tipo === 'Automático').slice(10);
            autoList.forEach(b => { localStorage.removeItem(LS_KEYS.backupPrefix + b.id); });
            this.setBackups(lista.filter(b => !autoList.includes(b)));
        } else {
            this.setBackups(lista);
        }
        return { success: true, nome, tamanho: (conteudo.length / 1024).toFixed(2) + ' KB' };
    },
    deleteBackup(id) {
        localStorage.removeItem(LS_KEYS.backupPrefix + id);
        this.setBackups(this.getBackups().filter(b => b.id !== id));
        return { success: true };
    },
    getBackupContent(id) {
        return localStorage.getItem(LS_KEYS.backupPrefix + id);
    },
    importData(dados, modo = 'merge') {
        if (!dados || typeof dados !== 'object') return { error: 'Arquivo inválido.' };
        if (!dados.contas_parceladas && !dados.usuarios) return { error: 'Arquivo não contém dados válidos.' };
        let importados = 0;
        // Importar parcelas
        if (Array.isArray(dados.contas_parceladas)) {
            let atual = modo === 'replace' ? [] : this.getInstallments();
            dados.contas_parceladas.forEach(item => {
                const existe = atual.find(a => a.descricao === item.descricao && a.valor_total === item.valor_total);
                if (existe) return;
                atual.push({ ...item, id: item.id || Date.now() + Math.random() });
                importados++;
            });
            this.setInstallments(atual);
        }
        // Importar usuários (não sobrescreve)
        if (Array.isArray(dados.usuarios)) {
            const users = this.getUsers();
            dados.usuarios.forEach(u => {
                if (users.find(x => x.username.toLowerCase() === (u.username||'').toLowerCase())) return;
                users.push(u);
            });
            this.setUsers(users);
        }
        return { success: true, importados, modo };
    }
};

// ============================================================
// DOWNLOAD / UPLOAD HELPERS
// ============================================================
function downloadFile(content, filename, mime = 'application/json') {
    const blob = new Blob([content], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
}

// ============================================================
// FERIADOS BRASILEIROS
// ============================================================
function calcularPascoa(ano) {
    const a = ano % 19, b = Math.floor(ano / 100), c = ano % 100;
    const d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25);
    const g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30;
    const i = Math.floor(c / 4), k = c % 4;
    const l = (32 + 2 * e + 2 * i - h - k) % 7;
    const m = Math.floor((a + 11 * h + 22 * l) / 451);
    const mes = Math.floor((h + l - 7 * m + 114) / 31);
    const dia = ((h + l - 7 * m + 114) % 31) + 1;
    return `${ano}-${String(mes).padStart(2,'0')}-${String(dia).padStart(2,'0')}`;
}
function getFeriados(ano) {
    const tsP = new Date(calcularPascoa(ano) + 'T00:00:00').getTime();
    const dOff = (d) => new Date(tsP + d * 86400000).toISOString().split('T')[0];
    return {
        [`${ano}-01-01`]: 'Confraternização Universal',
        [`${ano}-04-21`]: 'Tiradentes',
        [`${ano}-05-01`]: 'Dia do Trabalho',
        [`${ano}-09-07`]: 'Independência do Brasil',
        [`${ano}-10-12`]: 'Nossa Senhora Aparecida',
        [`${ano}-11-02`]: 'Finados',
        [`${ano}-11-15`]: 'Proclamação da República',
        [`${ano}-11-20`]: 'Consciência Negra',
        [`${ano}-12-25`]: 'Natal',
        [dOff(-48)]: 'Carnaval (Segunda)',
        [dOff(-47)]: 'Carnaval (Terça)',
        [dOff(-46)]: 'Quarta-feira de Cinzas',
        [dOff(-2)]: 'Sexta-feira Santa',
        [dOff(60)]: 'Corpus Christi'
    };
}
function getComemorativas(ano) {
    return {
        [`${ano}-03-08`]: 'Dia Internacional da Mulher',
        [`${ano}-03-15`]: 'Dia do Consumidor',
        [`${ano}-04-01`]: 'Dia da Mentira',
        [`${ano}-04-22`]: 'Descobrimento do Brasil',
        [`${ano}-05-11`]: 'Dia das Mães',
        [`${ano}-06-12`]: 'Dia dos Namorados',
        [`${ano}-07-20`]: 'Dia do Amigo',
        [`${ano}-08-11`]: 'Dia do Estudante',
        [`${ano}-08-22`]: 'Dia do Folclore',
        [`${ano}-09-21`]: 'Dia da Árvore',
        [`${ano}-10-15`]: 'Dia do Professor',
        [`${ano}-10-31`]: 'Halloween',
        [`${ano}-11-19`]: 'Dia da Bandeira',
        [`${ano}-12-24`]: 'Véspera de Natal',
        [`${ano}-12-31`]: 'Véspera de Ano Novo'
    };
}

function LoginScreen({ onLogin, isDark, toggleTheme }) {
    const [modo, setModo] = useState('login');
    const [f, setF] = useState({ username:'', password:'', confirmPassword:'', nome:'', email:'' });
    const [error, setError] = useState('');
    const [success, setSuccess] = useState('');
    const [loading, setLoading] = useState(false);
    const reset = () => { setF({ username:'', password:'', confirmPassword:'', nome:'', email:'' }); setError(''); setSuccess(''); };
    const upd = (k) => (e) => setF({ ...f, [k]: e.target.value });

    const handleLogin = async (e) => {
        e.preventDefault(); setLoading(true); setError(''); setSuccess('');
        try {
            const user = DB.findUser(f.username);
            if (!user) { setError('Usuário ou senha incorretos.'); setLoading(false); return; }
            const hash = await hashPassword(f.password);
            if (hash !== user.password) { setError('Usuário ou senha incorretos.'); setLoading(false); return; }
            DB.set(LS_KEYS.session, { username: user.username, id: user.id, at: Date.now() });
            onLogin(user.username);
        } catch { setError('Erro ao processar login.'); }
        setLoading(false);
    };

    const handleRegister = async (e) => {
        e.preventDefault(); setError(''); setSuccess('');
        if (f.password !== f.confirmPassword) { setError('As senhas não coincidem.'); return; }
        if (f.password.length < 6) { setError('Senha deve ter 6+ caracteres.'); return; }
        if (f.username.length < 3) { setError('Usuário deve ter 3+ caracteres.'); return; }
        setLoading(true);
        const res = await DB.createUser({ username: f.username, password: f.password, nome: f.nome, email: f.email });
        if (res.success) {
            setSuccess('Conta criada! Faça login.');
            setTimeout(() => { setModo('login'); reset(); }, 2000);
        } else { setError(res.error); }
        setLoading(false);
    };

    const bgClass = isDark ? 'bg-gradient-to-br from-[#1C1F2E] via-[#252A3D] to-[#1C1F2E]' : 'bg-gradient-to-br from-[#F5F6FA] via-white to-[#E5E8F0]';
    const cardBg = isDark ? 'bg-[#252A3D]/90 border-[#353B54]' : 'bg-white/90 border-[#E5E8F0]';
    const inputBg = isDark ? 'bg-[#1C1F2E] border-[#353B54] text-[#E4E6EF]' : 'bg-[#F5F6FA] border-[#E5E8F0] text-[#2E3440]';
    const txtMuted = isDark ? 'text-[#9BA3B8]' : 'text-[#7A8095]';
    const tabBg = isDark ? 'bg-[#1C1F2E]/60' : 'bg-[#F0F2F8]';

    return (
        <div className={`min-h-screen flex items-center justify-center p-4 ${bgClass} transition-colors duration-300`}>
            <div className="fixed top-4 right-4 z-10"><Theme3D isDark={isDark} toggle={toggleTheme}/></div>
            <div className={`w-full max-w-md p-8 rounded-3xl backdrop-blur-xl border shadow-2xl animate-in ${cardBg}`}>
                <div className="flex justify-center mb-6">
                    <div className="p-4 bg-gradient-to-br from-accent-teal to-accent-lavender rounded-2xl shadow-lg shadow-accent-teal/20">

function CalendarView({ isDark }) {
    const [dt, setDt] = useState(new Date());
    const [sel, setSel] = useState(null);
    const [installments, setInstallments] = useState(DB.getInstallments());
    const ano = dt.getFullYear(); const mes = dt.getMonth() + 1;
    const meses = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
    const sem = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
    const feriados = getFeriados(ano);
    const comemorativas = getComemorativas(ano);

    const mudar = (d) => setDt(new Date(ano, mes - 1 + d, 1));
    const primeiro = new Date(ano, mes - 1, 1).getDay();
    const total = new Date(ano, mes, 0).getDate();
    const dias = [];
    for (let i = 0; i < primeiro; i++) dias.push(null);
    for (let i = 1; i <= total; i++) dias.push(i);
    const hj = new Date();
    const isHoje = (d) => d === hj.getDate() && mes === (hj.getMonth() + 1) && ano === hj.getFullYear();
    const getEv = (dia) => {
        if (!dia) return { feriado:null, comemorativa:null, parcelas:[] };
        const k = `${ano}-${String(mes).padStart(2,'0')}-${String(dia).padStart(2,'0')}`;
        return {
            feriado: feriados[k] || null,
            comemorativa: comemorativas[k] || null,
            parcelas: installments.filter(p => p.proximo_vencimento === k && p.status !== 'Concluído')
        };
    };
    const evSel = sel ? getEv(sel) : null;
    const cardBg = isDark ? 'bg-softdark-card border-softdark-border' : 'bg-softlight-card border-softlight-border shadow-sm';
    const txtMut = isDark ? 'text-softdark-muted' : 'text-softlight-muted';
    const btnBg = isDark ? 'bg-softdark-hover text-accent-teal' : 'bg-softlight-hover text-accent-teal';

    return (
        <div className="space-y-6 animate-in">
            <div className={`p-6 rounded-2xl border ${cardBg}`}>
                <div className="flex flex-col md:flex-row md:justify-between md:items-center gap-4 mb-6">
                    <div className="flex items-center gap-3">
                        <button onClick={() => mudar(-1)} className={`p-2 rounded-lg ${btnBg}`} aria-label="Anterior"><Icon name="chevronLeft" className="w-5 h-5"/></button>
                        <h2 className="text-lg md:text-xl font-bold min-w-[180px] text-center">{meses[mes - 1]} {ano}</h2>
                        <button onClick={() => mudar(1)} className={`p-2 rounded-lg ${btnBg}`} aria-label="Próximo"><Icon name="chevronRight" className="w-5 h-5"/></button>
                        <button onClick={() => setDt(new Date())} className="px-3 py-2 text-sm bg-accent-teal/15 text-accent-teal rounded-lg hover:bg-accent-teal/25">Hoje</button>
                    </div>
                    <div className="flex flex-wrap gap-3 text-xs">
                        <span className="flex items-center gap-1"><div className="w-3 h-3 rounded-full bg-accent-rose"></div> Feriado</span>
                        <span className="flex items-center gap-1"><div className="w-3 h-3 rounded-full bg-accent-lavender"></div> Comemorativa</span>
                        <span className="flex items-center gap-1"><div className="w-3 h-3 rounded-full bg-accent-amber"></div> Vencimento</span>
                    </div>
                </div>
                <div className="grid grid-cols-7 gap-1 md:gap-2 mb-2">
                    {sem.map(d => <div key={d} className={`text-center text-xs font-bold py-2 ${txtMut}`}>{d}</div>)}
                </div>
                <div className="grid grid-cols-7 gap-1 md:gap-2">
                    {dias.map((dia, i) => {
                        const e = dia ? getEv(dia) : { feriado:null, comemorativa:null, parcelas:[] };
                        const tem = e.feriado || e.comemorativa || e.parcelas.length > 0;
                        const fim = [0, 6].includes(i % 7);
                        return (
                            <button key={i} onClick={() => dia && setSel(dia)} disabled={!dia}
                                className={`min-h-[70px] md:min-h-[90px] p-1 md:p-2 rounded-xl border text-left transition-all hover:scale-[1.02] ${
                                    !dia ? 'opacity-0 cursor-default' :
                                    isHoje(dia) ? 'border-accent-teal bg-accent-teal/15 ring-2 ring-accent-teal' :
                                    e.feriado ? 'border-accent-rose/50 bg-accent-rose/10' :
                                    tem ? isDark ? 'border-softdark-border bg-softdark-hover/50' : 'border-softlight-border bg-softlight-hover' :
                                    isDark ? `border-softdark-border ${fim ? 'bg-softdark-hover/30' : 'bg-softdark-hover/10'}` : `border-softlight-border ${fim ? 'bg-softlight-hover' : 'bg-softlight-bg'}`
                                }`}>
                                <div className={`text-xs md:text-sm font-bold mb-1 ${e.feriado ? 'text-accent-rose' : isHoje(dia) ? 'text-accent-teal' : ''}`}>{dia}</div>
                                <div className="space-y-0.5 hidden md:block">
                                    {e.feriado && <div className="text-[9px] bg-accent-rose/20 text-accent-rose px-1 rounded truncate">🔴 {e.feriado.substring(0,14)}</div>}
                                    {e.comemorativa && <div className="text-[9px] bg-accent-lavender/20 text-accent-lavender px-1 rounded truncate">💜 {e.comemorativa.substring(0,14)}</div>}
                                    {e.parcelas.map((p, idx) => (
                                        <div key={idx} className="text-[9px] bg-accent-amber/20 text-accent-amber px-1 rounded truncate">💰 {p.descricao.substring(0,12)}</div>
                                    ))}
                                </div>
                                {tem && <div className="md:hidden flex gap-0.5 mt-1">
                                    {e.feriado && <div className="w-1.5 h-1.5 rounded-full bg-accent-rose"/>}
                                    {e.comemorativa && <div className="w-1.5 h-1.5 rounded-full bg-accent-lavender"/>}
                                    {e.parcelas.length > 0 && <div className="w-1.5 h-1.5 rounded-full bg-accent-amber"/>}
                                </div>}
                            </button>
                        );
                    })}
                </div>
            </div>
            {sel && evSel && (
                <div className={`p-6 rounded-2xl border ${cardBg} animate-in`}>
                    <div className="flex justify-between items-center mb-4">
                        <h3 className="text-lg font-bold">Eventos de {String(sel).padStart(2,'0')}/{String(mes).padStart(2,'0')}/{ano}</h3>
                        <button onClick={() => setSel(null)} className={txtMut}><Icon name="x" className="w-5 h-5"/></button>
                    </div>
                    <div className="space-y-3">
                        {evSel.feriado && (
                            <div className="flex items-center gap-3 p-3 bg-accent-rose/10 border border-accent-rose/30 rounded-xl">
                                <div className="p-2 bg-accent-rose/20 text-accent-rose rounded-lg"><Icon name="info" className="w-5 h-5"/></div>
                                <div><p className="font-bold text-accent-rose">Feriado Nacional</p><p className="text-sm">{evSel.feriado}</p></div>
                            </div>
                        )}
                        {evSel.comemorativa && (
                            <div className="flex items-center gap-3 p-3 bg-accent-lavender/10 border border-accent-lavender/30 rounded-xl">
                                <div className="p-2 bg-accent-lavender/20 text-accent-lavender rounded-lg"><Icon name="gift" className="w-5 h-5"/></div>
                                <div><p className="font-bold text-accent-lavender">Data Comemorativa</p><p className="text-sm">{evSel.comemorativa}</p></div>
                            </div>
                        )}
                        {evSel.parcelas.map((p, i) => (
                            <div key={i} className="flex items-center gap-3 p-3 bg-accent-amber/10 border border-accent-amber/30 rounded-xl">
                                <div className="p-2 bg-accent-amber/20 text-accent-amber rounded-lg"><Icon name="dollar" className="w-5 h-5"/></div>
                                <div><p className="font-bold text-accent-amber">Vencimento</p><p className="text-sm">{p.descricao} - R$ {parseFloat(p.valor_parcela).toFixed(2)}</p></div>
                            </div>
                        ))}
                        {!evSel.feriado && !evSel.comemorativa && evSel.parcelas.length === 0 && (
                            <p className={`${txtMut} text-sm text-center py-4`}>Nenhum evento neste dia.</p>
                        )}
                    </div>
                </div>
            )}
        </div>
    );
}

// APP PRINCIPAL
// ============================================================
function App() {
    const [user, setUser] = useState(null);
    const [checking, setChecking] = useState(true);
    const [isDark, setIsDark] = useState(true);
    const [tab, setTab] = useState('dashboard');
    const [sideOpen, setSideOpen] = useState(false);
    const [inst, setInst] = useState([]);
    const [bkp, setBkp] = useState([]);
    const [modal, setModal] = useState(false);
    const [err, setErr] = useState('');
    const [form, setForm] = useState({ descricao:'', total:'', valorTotal:'' });
    const [lastAuto, setLastAuto] = useState(null);
    const [importModal, setImportModal] = useState(false);
    const [importFile, setImportFile] = useState(null);
    const [importModo, setImportModo] = useState('merge');
    const [importLoading, setImportLoading] = useState(false);
    const [importMsg, setImportMsg] = useState(null);
    const [dragActive, setDragActive] = useState(false);
    const fileInputRef = useRef(null);

    // Inicialização
    useEffect(() => {
        (async () => {
            // Cria usuário Dev se não existir
            if (DB.getUsers().length === 0) {
                await DB.createUser({ username: 'Dev', password: '123456', nome: 'Desenvolvedor', email: 'dev@fincontrol.com' });
            }
            // Verifica sessão existente
            const sess = DB.get(LS_KEYS.session, null);
            if (sess && sess.username) setUser(sess.username);
            // Tema salvo
            const t = DB.get(LS_KEYS.theme, 'dark');
            setIsDark(t === 'dark');
            // Último backup auto
            const lastTs = DB.get(LS_KEYS.lastAutoBackup, null);
            if (lastTs) setLastAuto(new Date(lastTs).toLocaleString('pt-BR'));
            setChecking(false);
        })();
    }, []);

    const refreshData = () => {
        setInst(DB.getInstallments());
        setBkp(DB.getBackups());
    };

    useEffect(() => { if (user) refreshData(); }, [user]);
    useEffect(() => {
        document.documentElement.classList.toggle('dark', isDark);
        DB.set(LS_KEYS.theme, isDark ? 'dark' : 'light');
    }, [isDark]);

    // Backup automático a cada 1 hora
    useEffect(() => {
        if (!user) return;
        const check = () => {
            const last = DB.get(LS_KEYS.lastAutoBackup, null);
            const precisa = !last || (Date.now() - last) >= 3600000;
            if (precisa) {
                DB.createBackup('Automático');
                DB.set(LS_KEYS.lastAutoBackup, Date.now());
                setLastAuto(new Date().toLocaleString('pt-BR'));
                refreshData();
            }
        };
        check();
        const interval = setInterval(check, 3600000);
        return () => clearInterval(interval);
    }, [user]);

    const toggle = () => setIsDark(!isDark);
    const logout = () => { DB.remove(LS_KEYS.session); setUser(null); };
    const handleLogin = (username) => { setUser(username); refreshData(); };

    const baixa = (id) => { DB.baixaParcela(id); refreshData(); };
    const addInst = (e) => {
        e.preventDefault();
        const r = DB.addInstallment({ descricao: form.descricao, numParcelas: form.total, valorTotal: form.valorTotal });
        if (r.error) { alert(r.error); return; }
        setModal(false); setForm({ descricao:'', total:'', valorTotal:'' }); refreshData();
    };

    const criarBkp = (tipo = 'Manual') => {
        const r = DB.createBackup(tipo);
        if (r.success) { refreshData(); alert(`Backup criado: ${r.nome}`); }
    };
    const delBkp = (id) => {
        if (!confirm('Excluir este backup?')) return;
        DB.deleteBackup(id); refreshData();
    };
    const exportarAtual = () => {
        const data = {
            contas_parceladas: DB.getInstallments(),
            usuarios: DB.getUsers(),
            _meta: { gerado_em: new Date().toISOString(), versao: VERSAO, sistema: SISTEMA_NOME }
        };
        downloadFile(JSON.stringify(data, null, 2), `fincontrol_export_${new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')}.json`);
    };
    const baixarBackup = (id) => {
        const content = DB.getBackupContent(id);
        const b = DB.getBackups().find(x => x.id === id);
        if (content && b) downloadFile(content, b.nome_arquivo);
    };
    const handleImportSubmit = () => {
        if (!importFile) { setImportMsg({ tipo:'error', texto:'Selecione um arquivo JSON.' }); return; }
        if (!importFile.name.toLowerCase().endsWith('.json')) { setImportMsg({ tipo:'error', texto:'O arquivo deve ser .json' }); return; }
        setImportLoading(true); setImportMsg(null);
        const reader = new FileReader();
        reader.onload = (ev) => {
            try {
                const dados = JSON.parse(ev.target.result);
                const r = DB.importData(dados, importModo);
                if (r.success) {
                    setImportMsg({ tipo:'success', texto:`Importação concluída! ${r.importados} registro(s). Modo: ${r.modo === 'replace' ? 'Substituir' : 'Mesclar'}.` });
                    refreshData();
                    setTimeout(() => { setImportModal(false); setImportFile(null); setImportMsg(null); }, 2500);
                } else { setImportMsg({ tipo:'error', texto: r.error }); }
            } catch { setImportMsg({ tipo:'error', texto: 'Arquivo JSON inválido.' }); }
            setImportLoading(false);
        };
        reader.onerror = () => { setImportMsg({ tipo:'error', texto:'Erro ao ler arquivo.' }); setImportLoading(false); };
        reader.readAsText(importFile);
    };
    const handleFileDrop = (e) => {
        e.preventDefault(); setDragActive(false);
        if (e.dataTransfer.files && e.dataTransfer.files[0]) { setImportFile(e.dataTransfer.files[0]); setImportMsg(null); }
    };

    // Exportação de relatórios
    const exportarRelatorio = (formato) => {
        const dados = DB.getInstallments();
        const ts = new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');
        if (formato === 'json') {
            downloadFile(JSON.stringify(dados, null, 2), `relatorio_financeiro_${ts}.json`);
        } else if (formato === 'csv') {
            let csv = '\uFEFF';
            csv += 'ID;Descrição;Valor Total;Nº Parcelas;Pagas;Valor Parcela;Vencimento;Status;Criado em\n';
            dados.forEach(r => {
                csv += `${r.id};"${r.descricao}";${r.valor_total};${r.num_parcelas};${r.parcelas_pagas};${parseFloat(r.valor_parcela).toFixed(2)};${r.proximo_vencimento||'-'};${r.status};${r.created_at}\n`;
            });
            downloadFile(csv, `relatorio_financeiro_${ts}.csv`, 'text/csv;charset=utf-8');
        } else if (formato === 'excel') {
            let html = '\uFEFF<table border="1"><tr style="background:#7ECFC5;color:#fff;"><th>ID</th><th>Descrição</th><th>Valor Total</th><th>Parcelas</th><th>Pagas</th><th>Valor Parcela</th><th>Vencimento</th><th>Status</th></tr>';
            dados.forEach(r => {
                html += `<tr><td>${r.id}</td><td>${r.descricao}</td><td>${r.valor_total}</td><td>${r.num_parcelas}</td><td>${r.parcelas_pagas}</td><td>${parseFloat(r.valor_parcela).toFixed(2)}</td><td>${r.proximo_vencimento||'-'}</td><td>${r.status}</td></tr>`;
            });
            html += '</table>';
            downloadFile(html, `relatorio_financeiro_${ts}.xls`, 'application/vnd.ms-excel;charset=utf-8');
        } else if (formato === 'pdf') {
            const win = window.open('', '_blank');
            let html = `<html><head><title>Relatório - FinControl v${VERSAO}</title><style>body{font-family:Arial;padding:20px}h1{color:#7ECFC5}table{width:100%;border-collapse:collapse}th{background:#7ECFC5;color:#fff;padding:10px;text-align:left}td{padding:8px;border-bottom:1px solid #ddd}tr:nth-child(even){background:#F5F6FA}@media print{button{display:none}}</style></head><body><button onclick="window.print()" style="padding:10px 20px;background:#7ECFC5;color:#fff;border:none;border-radius:8px;cursor:pointer;margin-bottom:20px">🖨️ Imprimir/Salvar PDF</button><h1>Relatório Financeiro - FinControl v${VERSAO}</h1><p>Gerado em: ${new Date().toLocaleString('pt-BR')}</p><table><tr><th>ID</th><th>Descrição</th><th>Valor Total</th><th>Parcelas</th><th>Pagas</th><th>Valor Parcela</th><th>Vencimento</th><th>Status</th></tr>`;
            dados.forEach(r => {
                html += `<tr><td>${r.id}</td><td>${r.descricao}</td><td>R$ ${parseFloat(r.valor_total).toFixed(2)}</td><td>${r.num_parcelas}</td><td>${r.parcelas_pagas}</td><td>R$ ${parseFloat(r.valor_parcela).toFixed(2)}</td><td>${r.proximo_vencimento||'-'}</td><td>${r.status}</td></tr>`;
            });
            html += '</table></body></html>';
            win.document.write(html); win.document.close();
        }
    };

    // Classes
    const bgCard = isDark ? 'bg-softdark-card border-softdark-border' : 'bg-softlight-card border-softlight-border shadow-sm';
    const txtMut = isDark ? 'text-softdark-muted' : 'text-softlight-muted';
    const sideBg = isDark ? 'bg-[#222738] border-softdark-border' : 'bg-softlight-card border-softlight-border';
    const inputBg = isDark ? 'bg-softdark-bg border-softdark-border text-softdark-text' : 'bg-softlight-bg border-softlight-border text-softlight-text';

    const totAtivas = inst.filter(i => i.status === 'Ativo').length;
    const totPago = inst.reduce((a, i) => a + (i.parcelas_pagas * parseFloat(i.valor_parcela)), 0);
    const saldoDev = inst.reduce((a, i) => a + ((i.num_parcelas - i.parcelas_pagas) * parseFloat(i.valor_parcela)), 0);

    // ============ TELAS ============

                            onChange={(e) => { if (e.target.files[0]) { setImportFile(e.target.files[0]); setImportMsg(null); } }}/>
                        <Icon name="upload" className="w-10 h-10 mx-auto mb-3 text-accent-teal"/>
                        {importFile ? (
                            <div>
                                <p className="font-bold text-accent-sage">✓ {importFile.name}</p>
                                <p className={`text-xs ${txtMut} mt-1`}>{(importFile.size / 1024).toFixed(2)} KB</p>
                            </div>
                        ) : (
                            <div>
                                <p className="font-medium">Clique ou arraste o arquivo aqui</p>
                                <p className={`text-xs ${txtMut} mt-1`}>Apenas arquivos .json</p>
                            </div>
                        )}
                    </div>
                    {importMsg && (
                        <div className={`p-3 rounded-lg text-sm border ${importMsg.tipo === 'success' ? 'bg-accent-sage/10 border-accent-sage/30 text-accent-sage' : 'bg-accent-rose/10 border-accent-rose/30 text-accent-rose'}`}>
                            {importMsg.texto}
                        </div>
                    )}
                    <div className="pt-2 flex justify-end gap-3">
                        <button type="button" onClick={() => { setImportModal(false); setImportFile(null); setImportMsg(null); }} className={`px-4 py-2 rounded-lg ${txtMut}`}>Cancelar</button>
                        <button type="button" onClick={handleImportSubmit} disabled={importLoading || !importFile}
                            className="px-6 py-2 bg-gradient-to-r from-accent-teal to-accent-lavender text-white rounded-lg font-bold disabled:opacity-50 flex items-center gap-2">
                            {importLoading ? 'Importando...' : (<><Icon name="upload" className="w-4 h-4"/> Importar</>)}
                        </button>
                    </div>
                </div>
            </Modal>
        </div>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
